[project]
name = "rawpick"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.10"
dependencies = [
    "einops>=0.8.2",
    "fastapi>=0.141.1",
    "numpy>=2.2.6",
    "open-clip-torch>=3.3.0",
    "opencv-python<5",
    "pillow>=12.3.0",
    "rawpy>=0.27.0",
    "thop>=0.1.1.post2209072238",
    "tifffile>=2025.5.10",
    "timm>=1.0.28",
    "torch>=2.6.0",
    "uvicorn[standard]>=0.52.4",
]

# 윈도우(CUDA)에서만 cu124 휠 사용 — 맥에서는 PyPI 기본 torch(MPS 지원)로 설치됨
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32'" }]
